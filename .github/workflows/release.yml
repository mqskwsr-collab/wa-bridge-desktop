name: Release (Windows installer)

# Push a tag like v1.0.1 (after raising "version" in package.json to 1.0.1) and this builds the installer,
# publishes it as a GitHub release, and every installed app updates itself from it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag must match package.json version
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1
          fi
      - name: Build installer
        run: npx electron-builder --win --publish never
      # one explicit release (electron-builder's own parallel upload can create duplicates)
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          FILES="dist/WA-Bridge-Setup-$V.exe dist/WA-Bridge-Setup-$V.exe.blockmap dist/latest.yml"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --title "WA Bridge $V" --generate-notes
          fi
